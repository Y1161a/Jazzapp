<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="jazzGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#b87d51" />
      <stop offset="100%" stop-color="#4e2f25" />
    </linearGradient>
    <radialGradient id="cupBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#24201d" />
      <stop offset="100%" stop-color="#131110" />
    </radialGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#cupBg)" />
  <!-- Outer glowing rim -->
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="url(#jazzGrad)" stroke-width="8" stroke-opacity="0.4" />
  
  <!-- Coffee Cup Body -->
  <path d="M120 200 H336 V304 C336 348 300 384 256 384 H200 C156 384 120 348 120 304 Z" fill="#2a1711" stroke="#d4af37" stroke-width="14" stroke-linejoin="round" />
  
  <!-- Cup Handle -->
  <path d="M336 224 H364 C392 224 416 248 416 276 C416 304 392 328 364 328 H336" stroke="#d4af37" stroke-width="14" stroke-linecap="round" fill="none" />
  
  <!-- Saucer Base -->
  <path d="M100 416 H356" stroke="#b87d51" stroke-width="16" stroke-linecap="round" />
  
  <!-- Steam Curves (Coffee aroma + Jazz musical feel) -->
  <path d="M180 160 Q 165 130 180 100 Q 195 70 180 44" stroke="#d4af37" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.85" />
  <path d="M228 168 Q 213 134 228 102 Q 243 68 228 40" stroke="#f5eee6" stroke-width="12" stroke-linecap="round" opacity="0.95" />
  <path d="M276 160 Q 261 130 276 100 Q 291 70 276 44" stroke="#d4af37" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.85" />

  <!-- Coffee Crema Accent inside cup -->
  <ellipse cx="228" cy="204" rx="96" ry="16" fill="#b87d51" opacity="0.9" />
</svg>
